version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL + PostGIS (Spatial & Time-Series Data Store)
  # -------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis_db
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_user -d aegis_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  # -------------------------------------------------------------
  # Redis Cache & In-Memory Rate Limiting
  # -------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: aegis-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  # -------------------------------------------------------------
  # AEGIS Unified Data Core Backend (FastAPI + APScheduler)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://aegis_user:aegis_secure_password_2026@postgres:5432/aegis_db
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
      JWT_SECRET_KEY: "aegis_super_secret_jwt_key_multi_hazard_2026_secure"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:80"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aegis-network

  # -------------------------------------------------------------
  # AEGIS Web Client (React + Vite SPA)
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aegis-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - aegis-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aegis-network:
    driver: bridge
