name: AEGIS CI/CD - Production Verification & Testing

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Security Checks
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DEBUG: "true"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379/0"
      JWT_SECRET_KEY: "ci_test_jwt_secret_key_minimum_32_characters_long"
      ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
      AEGIS_WEB_CLIENT_KEY: "test_web_client_key"
      AEGIS_APP_CLIENT_KEY: "test_app_client_key"
      AEGIS_ADMIN_CLIENT_KEY: "test_admin_client_key"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite (40/40 Tests)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests -v --durations=10

      - name: Security Scan - Prevent Secret Leaks
        run: |
          echo "Scanning repository for accidentally tracked .env files..."
          if git ls-files | grep -E "^\.env$|\.env\.local$|\.pem$|\.key$"; then
            echo "ERROR: Tracked sensitive file found in Git index!"
            exit 1
          fi
          echo "Secret audit passed."

  frontend-build:
    name: Frontend Admin Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

  docker-verification:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: aegis-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: aegis-frontend:ci
