name: AEGIS Master Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Validation & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio flake8 bandit
      - name: Security Scan (Bandit)
        run: |
          bandit -r backend/app -ll
      - name: Run Backend Unit Tests
        run: |
          pytest backend/tests/

  web-build:
    name: Web Portal Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json
      - name: Install Dependencies
        working-directory: ./web
        run: npm ci
      - name: Type Check & Build
        working-directory: ./web
        run: npm run build

  mobile-test:
    name: Mobile App Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json
      - name: Install Dependencies
        working-directory: ./mobile
        run: npm ci
      - name: Run Mobile Test Suite
        working-directory: ./mobile
        run: npm test -- --passWithNoTests
